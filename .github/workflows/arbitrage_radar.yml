name: E-Commerce Arbitrage Radar (24/7 Free Public Runner)

on:
  schedule:
    # Her 15 dakikada bir çalışır (Public repolarda GitHub Actions dakikaları ücretsiz ve sınırsızdır;
    # 15 dakikalık aralık hem yeni indirimleri anında yakalar hem de WAF/IP engellerini önler)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      sites:
        description: 'Taranacak siteler (virgülle ayrılmış)'
        required: false
        default: 'occasion,superstep,instreet,barcin,korayspor'
      max_pages:
        description: 'Kategori başına maksimum sayfa sayısı'
        required: false
        default: '4'

# İki iş akışının aynı anda çalışıp git push çakışması yaratmasını önleyen kilit
concurrency:
  group: arbitrage-state-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Arbitrage Radar (--once)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_ON_FIRST_RUN: ${{ vars.NOTIFY_ON_FIRST_RUN || 'False' }}
          MAX_BASKET_PRICE: ${{ vars.MAX_BASKET_PRICE || '5500' }}
          MIN_TOTAL_DISCOUNT_RATE: ${{ vars.MIN_TOTAL_DISCOUNT_RATE || '40' }}
          MIN_NET_PROFIT_TL: ${{ vars.MIN_NET_PROFIT_TL || '550' }}
          MIN_ROI_PERCENT: ${{ vars.MIN_ROI_PERCENT || '30' }}
        run: |
          SITES="${{ github.event.inputs.sites || 'occasion,superstep,instreet,barcin,korayspor' }}"
          MAX_PAGES="${{ github.event.inputs.max_pages || '4' }}"
          python main.py --once --sites "$SITES" --max-pages "$MAX_PAGES"

      - name: Sync & Commit Updated Product State (data/products_state.json)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products_state.json
          if git diff --staged --quiet; then
            echo "Durum dosyasında (data/products_state.json) değişiklik yok, commit atlanıyor."
          else
            git commit -m "chore(state): update arbitrage product state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
          fi
