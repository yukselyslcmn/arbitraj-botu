name: E-Commerce Arbitrage Radar (24/7 Free Public Runner)

on:
  schedule:
    # Her 15 dakikada bir çalışır
    - cron: '*/15 * * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'data/products_state.json'
      - 'docs/**'
      - 'README.md'
      - '.gitignore'
      - 'GEMINI.md'
  workflow_dispatch:
    inputs:
      sites:
        description: 'Taranacak siteler (virgülle ayrılmış)'
        required: false
        default: 'occasion,superstep,instreet,barcin,korayspor,sportive,fashfed'
      max_pages:
        description: 'Kategori başına maksimum sayfa sayısı'
        required: false
        default: '4'

# İki iş akışının aynı anda çalışıp git push çakışması yaratmasını önleyen kilit
concurrency:
  group: arbitrage-state-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan-and-notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      # Node.js 20 tabanlı eski JavaScript aksiyonlarını (actions/checkout@v4, actions/setup-python@v5)
      # kullanmak yerine doğrudan Ubuntu 24.04'ün yerleşik Git ve Python 3.12 araçlarını kullanarak
      # "Node.js 20 is deprecated" uyarısını %100 ortadan kaldırır ve başlatma süresini hızlandırır.
      - name: Checkout Repository (Native Git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME:-main}"
          git checkout -B "${GITHUB_REF_NAME:-main}" "origin/${GITHUB_REF_NAME:-main}"

      - name: Set up Python 3.12 Virtual Environment & Install Dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip -q
          .venv/bin/pip install -r requirements.txt -q

      - name: Run Arbitrage Radar (--once)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_ON_FIRST_RUN: ${{ vars.NOTIFY_ON_FIRST_RUN || 'True' }}
          MAX_BASKET_PRICE: ${{ vars.MAX_BASKET_PRICE || '5500' }}
          MIN_TOTAL_DISCOUNT_RATE: ${{ vars.MIN_TOTAL_DISCOUNT_RATE || '40' }}
          MIN_NET_PROFIT_TL: ${{ vars.MIN_NET_PROFIT_TL || '550' }}
          MIN_ROI_PERCENT: ${{ vars.MIN_ROI_PERCENT || '30' }}
          INPUT_SITES: ${{ github.event.inputs.sites }}
          INPUT_MAX_PAGES: ${{ github.event.inputs.max_pages }}
        run: |
          SITES="${INPUT_SITES:-occasion,superstep,instreet,barcin,korayspor,sportive,fashfed}"
          MAX_PAGES="${INPUT_MAX_PAGES:-4}"
          .venv/bin/python main.py --once --sites "$SITES" --max-pages "$MAX_PAGES"

      - name: Export Static Cloud Dashboard (docs/ for GitHub Pages)
        run: |
          .venv/bin/python dashboard.py --export-static docs

      - name: Sync & Commit Updated Product State and Cloud Dashboard
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products_state.json docs/
          if git diff --staged --quiet; then
            echo "Durum dosyasında ve bulut panelinde değişiklik yok, commit atlanıyor."
          else
            git commit -m "chore(state): sync arbitrage product state and cloud dashboard [skip ci]"
            git fetch --depth=25 origin "${GITHUB_REF_NAME:-main}"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME:-main}"
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
          fi
