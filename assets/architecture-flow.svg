    <text x="16" y="112" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#cbd5e1">• InStreet (Next.js App State)</text>
    <text x="16" y="134" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#cbd5e1">• Barçın &amp; Korayspor (JSON/SSR)</text>
