    <text x="122.5" y="175" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#34d399">TelegramNotifier (sendPhoto)</text>
    <text x="122.5" y="191" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10" fill="#94a3b8">Inline Butonlar + Spam Koruması</text>
