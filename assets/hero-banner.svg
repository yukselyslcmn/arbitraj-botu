    <text x="34" y="230" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#d1fae5">Gardrops / Sahibinden Net Kâr:</text>
    <text x="320" y="230" text-anchor="end" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#34d399">+1.345 TL (%34.5 ROI)</text>
    <text x="34" y="254" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#d1fae5">Dolap (%15 Komisyon + Kargo) Net:</text>
    <text x="320" y="254" text-anchor="end" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">+832 TL (%21.3 ROI)</text>

    <!-- Target Sizes -->
    <text x="20" y="298" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#93c5fd">👟 Stoktaki Hedef Bedenler: 37.5, 38, 38.5, 39, 40</text>
  </g>
</svg>
