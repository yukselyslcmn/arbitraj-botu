    <circle cx="18" cy="16" r="5" fill="#10b981"/>
    <text x="34" y="21" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#a7f3d0" letter-spacing="0.8">7/24 OTONOM ARBİTRAJ RADARI</text>

    <text x="0" y="82" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff">Türkiye E-Ticaret</text>
    <text x="0" y="132" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="url(#accentGrad)">Arbitraj &amp; Flipping Botu</text>

    <text x="0" y="175" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" fill="#9ca3af">
      5 Yetkili Orijinal Distribütör Mağazayı eşzamanlı tarar, sepetteki gizli indirimleri
    </text>
    <text x="0" y="200" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" fill="#9ca3af">
      ve Akakçe piyasa dip fiyatını doğrular, net kâr/ROI hesaplayıp Telegram'a bildirir.
    </text>

    <!-- Store Pills -->
    <g transform="translate(0, 232)" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="700">
      <rect x="0" y="0" width="105" height="34" rx="8" fill="#1f2937" stroke="#374151"/>
      <text x="52.5" y="22" text-anchor="middle" fill="#f3f4f6">Occasion</text>

      <rect x="115" y="0" width="110" height="34" rx="8" fill="#1f2937" stroke="#374151"/>
      <text x="170" y="22" text-anchor="middle" fill="#f3f4f6">SuperStep</text>

      <rect x="235" y="0" width="100" height="34" rx="8" fill="#1f2937" stroke="#374151"/>
      <text x="285" y="22" text-anchor="middle" fill="#f3f4f6">InStreet</text>

      <rect x="345" y="0" width="95" height="34" rx="8" fill="#1f2937" stroke="#374151"/>
