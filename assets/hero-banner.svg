    <text x="335" y="132" text-anchor="end" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#f87171">6.359 TL</text>
    <rect x="20" y="140" width="315" height="8" rx="4" fill="#374151"/>
    <rect x="20" y="140" width="285" height="8" rx="4" fill="#ef4444"/>

    <text x="20" y="172" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#9ca3af">Sepette Net Alış Fiyatı (%50 İndirim)</text>
    <text x="335" y="172" text-anchor="end" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#34d399">3.899 TL</text>
    <rect x="20" y="180" width="315" height="8" rx="4" fill="#374151"/>
    <rect x="20" y="180" width="175" height="8" rx="4" fill="#10b981"/>

