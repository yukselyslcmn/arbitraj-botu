      <rect x="570" y="0" width="115" height="34" rx="8" fill="#1e3a8a" stroke="#3b82f6"/>
      <text x="627.5" y="22" text-anchor="middle" fill="#93c5fd">+ Akakçe</text>
    </g>

    <!-- Bottom Metric Badges -->
    <g transform="translate(0, 286)" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600">
      <text x="0" y="18" fill="#10b981">✔ TLS Impersonation (curl_cffi)</text>
      <text x="215" y="18" fill="#38bdf8">✔ Kesirli Beden Normalizasyonu (42 2/3 → 42.5)</text>
