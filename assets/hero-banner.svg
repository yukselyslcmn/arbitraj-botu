    <text x="335" y="36" text-anchor="end" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fbbf24">⭐ 86 / 100</text>

    <text x="20" y="70" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Nike Shox TL / Air Force 1</text>
    <text x="20" y="92" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#9ca3af">Mağaza: SuperStep • SKU: AR3565-004</text>

    <line x1="20" y1="108" x2="335" y2="108" stroke="#374151" stroke-width="1"/>

